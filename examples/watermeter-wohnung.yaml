substitutions:
  name: "watermeter-wohnung"
  friendly_name: watermeter-wohnung
    
esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  devices:
    - id: lorenz_22308176_device
      name: "Kaltwasser Gästebad 22308176"
    - id: lorenz_22308860_device
      name: "Kaltwasser Masterbad 22308860"
    - id: lorenz_22323962_device
      name: "Warmwasser Gästebad 22323962"
    - id: lorenz_22324011_device
      name: "Warmwasser Masterbad 22324011"
    - id: engelmann_23651845_device
      name: "Fussbodenheizung 23651845"
    - id: lorenz_23120547_device
      name: "Waschkeller"

esp32:
  board: esp32dev
  toolchain: esp-idf
  framework:
    type: esp-idf
    advanced:
      loop_task_stack_size: 16384
      minimum_chip_revision: "3.0"
      sram1_as_iram: true


logger:
  level: INFO  # Set to DEBUG only to capture frame hex dumps (uses much more heap and log bandwidth)
  tx_buffer_size: 2048  # Increase buffer to prevent log truncation
  baud_rate: 115200
  logs:
    component: INFO     # Reduce noise from other components
    esp32: INFO
    spi: INFO
    app: INFO
    wifi: INFO         # Disable WiFi scan logs
    wmbus_radio: INFO  # Show frame hex dumps
    cc1101: INFO       # Show CC1101 details

api:
  encryption:
    key: !secret api_watermeter

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE          # Disable WiFi power saving for stability
  fast_connect: true              # Skip scanning, connect directly
  reboot_timeout: 5min           # Reboot if disconnected for 15 min

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "portal_${friendly_name}"
    password: !secret esphome_ap_password

captive_portal:

time:
  - platform: homeassistant

button:
  - platform: restart
    id: "watermeter_keller"
    name: "restart_${friendly_name}"

external_components:
  - source: github://enr0c/esphome-components@copilot/fix-esphome-2026-compatibility
    components: [ wmbus_radio, wmbus_meter, wmbus_common ]
    refresh: 0min

# Your wiring: 
# VCC = red       -> 3.3V
# GND = orange    -> GND
# MOSI = yellow   -> GPIO23 (standard VSPI)
# S/CLK = green   -> GPIO18 (standard VSPI)
# MISO = blue     -> GPIO19 (standard VSPI)
# GDO2 = grey     -> not connected
# GDO0 = purple   -> GPIO26
# CSN = white     -> GPIO25

spi:
  clk_pin:  GPIO18  # green
  mosi_pin: GPIO19  # yellow
  miso_pin: GPIO23  # blue

wmbus_radio:
  id: radio
  radio_type: CC1101
  cs_pin: GPIO25  # white
  gdo2_pin:
    number: GPIO27  # grey
    mode: INPUT_PULLDOWN
  gdo0_pin: GPIO26  # puprple
  frequency: 868.95
  on_frame:
    - then:
        - logger.log:
            level: DEBUG
            format: "RSSI: %ddBm T: %s (%d) %s"
            args: [ frame->rssi(), frame->as_hex().c_str(), frame->data().size(), toString(frame->link_mode()) ]

# wM-Bus common configuration (no specific meters configured - scan all)
wmbus_common:
  drivers:
    - waterstarm
    - sensostar

wmbus_meter:
  - id: lorenz_23120547
    radio_id: radio
    meter_id: 0x23120547
    type: waterstarm
    key: !secret lorenz_23120547
    on_telegram:
          then:
            - logger.log:
                level: INFO
                format: "wmbus %s: %s"
                args:
                  - meter.get_id().c_str()
                  - meter.as_json(false).c_str()
